<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task Manager</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="app-header">
            <h1>Smart Task Manager</h1>
        </header>

        <div class="app-layout">
            <aside class="sidebar">
            <ul>
                <li>งานทั้งหมด</li>
                <li>งานที่เสร็จแล้ว</li>
            </ul>
        </aside>
        
            <div class="main-content">
                <!-- Lab 5 - ข้อ 1: เพิ่มส่วนฟอร์มสำหรับรับข้อมูลใหม่ -->
                <form id="taskForm" style="margin-bottom: 20px; display: flex; gap: 10px;">
                    <input type="text" id="taskInput" placeholder="เพิ่มงานใหม่..." required
                    style="flex-grow: 1; padding: 10px;">
                    <select id="priorityInput">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                    <button type="submit" style="padding: 10px 20px;">เพิ่มงาน</button>
                </form>

                <!-- พื้นที่แสดงงาน (ลบการ์ดจำลองทิ้ง ปล่อยให้ว่างไว้) -->
                <main class="main-content" id="taskList" style="padding: 0;"></main>
            </div>
        </div>
        <!-- ข้อ 1: ผูกไฟล์ script.js ก่อนปิด </body> -->
        <script src="script.js"></script>
    </body>
</html>
